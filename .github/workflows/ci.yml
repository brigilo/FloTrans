# Pipeline de Integración Continua básica - FloTrans
# Ubicación en el repositorio: .github/workflows/ci.yml
name: CI FloTrans

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Verificar sintaxis de los servicios PHP (api/)
        run: |
          for f in api/*.php; do
            echo "Revisando $f"
            php -l "$f"
          done

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxis de JavaScript (api/session_guard.js)
        run: node --check api/session_guard.js

      - name: Verificar que existan las páginas principales
        run: |
          for f in Login.html Dashboard.html conductores.html vehiculos.html Rutas.html; do
            test -f "$f" && echo "OK: $f" || { echo "FALTA: $f"; exit 1; }
          done
          
