name: CI FloTrans

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validar-php:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validar sintaxis PHP
        run: |
          find api -name "*.php" -print0 | xargs -0 -n1 php -l
